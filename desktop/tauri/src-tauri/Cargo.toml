[package]
name = "miaohui-desktop"
version = "0.1.0"
description = "MiaoHui local-first creative workstation"
authors = ["MiaoHui"]
license = "Proprietary"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "miaohui_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-shell = "2"
