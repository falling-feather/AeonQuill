[package]
name = "aeonquill-desktop"
version = "0.4.3"
description = "AEONQUILL local-first image and video creative workstation"
authors = ["AEONQUILL contributors"]
license = "Proprietary"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "aeonquill_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-shell = "2"
