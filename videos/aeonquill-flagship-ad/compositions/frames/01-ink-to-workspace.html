  <script>
    (function () {
      var root = document.querySelector('[data-composition-id="01-ink-to-workspace"]');
      var world = document.getElementById("f01-ink-to-workspace-world");
      var target = document.getElementById("f01-ink-to-workspace-detail-target");

      var rootRect = root.getBoundingClientRect();
      var targetRect = target.getBoundingClientRect();
      var targetCenterX = ((targetRect.left + targetRect.width / 2 - rootRect.left) / rootRect.width) * 1920;
      var targetCenterY = ((targetRect.top + targetRect.height / 2 - rootRect.top) / rootRect.height) * 1080;
      var offsetX = targetCenterX - 960;
      var offsetY = targetCenterY - 540;
      var openScale = 5.6;

      var cam = {
        scale: openScale,
        x: -offsetX * openScale,
        y: -offsetY * openScale
      };

      function applyCamera() {
        world.style.transform =
          "translate(" + cam.x + "px, " + cam.y + "px) scale(" + cam.scale + ")";
      }

      function primePath(path) {
        var length = path.getTotalLength();
        gsap.set(path, {
          strokeDasharray: length,
          strokeDashoffset: length
        });
      }

      applyCamera();

      var goldPath = document.getElementById("f01-ink-to-workspace-gold-path");
      var routeIds = [
        "f01-ink-to-workspace-leader-project",
        "f01-ink-to-workspace-route-project-modes",
        "f01-ink-to-workspace-leader-modes",
        "f01-ink-to-workspace-route-modes-runtime",
        "f01-ink-to-workspace-leader-runtime"
      ];

      primePath(goldPath);
      routeIds.forEach(function (id) {
        primePath(document.getElementById(id));
      });

      var tl = gsap.timeline({ paused: true });

      tl.fromTo(
        "[data-f01-glyph]:nth-child(1)",
        { opacity: 0, y: 10 },
        { opacity: 1, y: 0, duration: 0.34, ease: "power2.out" },
        0.08
      );
      tl.fromTo(
        "[data-f01-glyph]:nth-child(2)",
        { opacity: 0, y: 10 },
        { opacity: 1, y: 0, duration: 0.34, ease: "power2.out" },
        0.28
      );
      tl.to(
        goldPath,
        { strokeDashoffset: 0, duration: 0.68, ease: "power2.out" },
        0.12
      );

      tl.to(
        cam,
        {
          scale: 1,
          x: 0,
          y: 0,
          duration: 2.8,
          ease: "expo.out",
          onUpdate: applyCamera
        },
        0
      );

      var callouts = [
        {
          text: "项目",
          group: "f01-ink-to-workspace-callout-project",
          node: "f01-ink-to-workspace-node-project",
          paths: ["f01-ink-to-workspace-leader-project"]
        },
        {
          text: "三种模式",
          group: "f01-ink-to-workspace-callout-modes",
          node: "f01-ink-to-workspace-node-modes",
          paths: [
            "f01-ink-to-workspace-route-project-modes",
            "f01-ink-to-workspace-leader-modes"
          ]
        },
        {
          text: "本地运行时",
          group: "f01-ink-to-workspace-callout-runtime",
          node: "f01-ink-to-workspace-node-runtime",
          paths: [
            "f01-ink-to-workspace-route-modes-runtime",
            "f01-ink-to-workspace-leader-runtime"
          ]
        }
      ];

      var sequenceCursor = 2.8;
      var sequence = callouts.map(function (entry) {
        var duration = 0.18 + entry.text.length * 0.025;
        var item = {
          start: sequenceCursor,
          end: sequenceCursor + duration,
          duration: duration,
          entry: entry
        };
        sequenceCursor = item.end;
        return item;
      });

      sequence.forEach(function (item) {
        item.entry.paths.forEach(function (pathId, index) {
          tl.to(
            document.getElementById(pathId),
            {
              strokeDashoffset: 0,
              duration: item.duration * 0.78,
              ease: "power2.out"
            },
            item.start + index * 0.025
          );
        });

        tl.fromTo(
          document.getElementById(item.entry.group),
          { opacity: 0, y: 10 },
          {
            opacity: 1,
            y: 0,
            duration: Math.min(0.26, item.duration),
            ease: "power2.out"
          },
          item.start + 0.04
        );

        tl.fromTo(
          document.getElementById(item.entry.node),
          { opacity: 0, scale: 0 },
          { opacity: 1, scale: 1, duration: 0.18, ease: "power2.out" },
          item.start + 0.06
        );
      });

      window.__timelines = window.__timelines || {};
      window.__timelines["01-ink-to-workspace"] = tl;
    })();
