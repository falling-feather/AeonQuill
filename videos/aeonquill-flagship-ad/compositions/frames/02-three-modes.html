  <script>
    (() => {
      const root = document.querySelector('[data-composition-id="02-three-modes"]');
      if (!root || typeof gsap === "undefined") return;

      const select = (selector) => root.querySelector(selector);
      const selectAll = (selector) => Array.from(root.querySelectorAll(selector));

      const icon = select("#frame-02-three-modes-app-icon");
      const brand = select("#frame-02-three-modes-brand-name");
      const surface = select("#frame-02-three-modes-surface");
      const sunBloom = select(".frame-02-three-modes-sun-bloom");
      const emberBloom = select(".frame-02-three-modes-ember-bloom");
      const modeLabels = selectAll(".frame-02-three-modes-mode-label");
      const modeWords = selectAll(".frame-02-three-modes-mode-word");
      const spotlights = [
        select("#frame-02-three-modes-spotlight-image"),
        select("#frame-02-three-modes-spotlight-pixel"),
        select("#frame-02-three-modes-spotlight-video"),
      ];
      const chainLine = select("#frame-02-three-modes-chain-line");
      const chainWord = select("#frame-02-three-modes-chain-word");
      const confirmPoint = select("#frame-02-three-modes-confirm-point");

      const tl = gsap.timeline({ paused: true });
      window.__timelines = window.__timelines || {};
      window.__timelines["02-three-modes"] = tl;

      gsap.set(modeLabels, { autoAlpha: 0 });
      gsap.set(spotlights, { autoAlpha: 0, x: 96 });
      gsap.set([chainLine, chainWord, confirmPoint], { autoAlpha: 0 });

      tl.fromTo(
        surface,
        {
          x: 72,
          rotationY: -7,
          rotationX: 2.5,
          rotationZ: -0.7,
          scale: 0.955,
          opacity: 0.28,
          transformPerspective: 2100,
        },
        {
          x: 0,
          rotationY: 0,
          rotationX: 0,
          rotationZ: 0,
          scale: 1,
          opacity: 1,
          transformPerspective: 2100,
          duration: 0.95,
          ease: "power3.out",
        },
        0,
      );

      tl.fromTo(
        icon,
        { y: -54, scale: 0.9, opacity: 0 },
        { y: 0, scale: 1, opacity: 1, duration: 0.72, ease: "power3.out" },
        0.04,
      );

      tl.fromTo(
        brand,
        { y: 20, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.52, ease: "power3.out" },
        0.3,
      );

      tl.fromTo(
        sunBloom,
        { scale: 0.96, opacity: 0.78 },
        { scale: 1.035, opacity: 1, duration: 5, ease: "none" },
        0,
      );

      tl.fromTo(
        emberBloom,
        { scale: 1.025, opacity: 0.72 },
        { scale: 0.985, opacity: 0.9, duration: 5, ease: "none" },
        0,
      );

      const MODE_SEQUENCE = [
        { t: 0, texts: ["", "", ""], active: -1 },
        { t: 0.08, texts: ["图像", "", ""], active: 0 },
        { t: 0.98, texts: ["图像", "像素", ""], active: 1 },
        { t: 1.88, texts: ["图像", "像素", "视频"], active: 2 },
      ];

      function modeStateAt(time) {
        for (let index = MODE_SEQUENCE.length - 1; index >= 0; index -= 1) {
          if (time >= MODE_SEQUENCE[index].t) return MODE_SEQUENCE[index];
        }
        return MODE_SEQUENCE[0];
      }

      function renderModeState(time) {
        const state = modeStateAt(time);
        modeLabels.forEach((label, index) => {
          const text = state.texts[index];
          modeWords[index].textContent = text;
          label.style.visibility = text ? "visible" : "hidden";
          label.style.opacity = text ? (index === state.active ? "1" : "0.44") : "0";
          label.style.backgroundColor = index === state.active
            ? "rgba(109, 125, 255, 0.88)"
            : "rgba(109, 125, 255, 0.18)";
        });
      }

      renderModeState(0);
      const modeDriver = { t: 0 };
      tl.to(
        modeDriver,
        {
          t: 2.7,
          duration: 2.7,
          ease: "none",
          onUpdate: () => renderModeState(modeDriver.t),
        },
        1,
      );

      const GLOW_TIMINGS = {
        image: { start: 0.08, end: 0.52 },
        pixel: { start: 0.98, end: 1.42 },
        video: { start: 1.88, end: 2.4 },
      };
      const ATTACK_DURATION = 0.14;
      const RELEASE_DURATION = 0.34;
      const REST_LEVEL = 0.1;
      const MAX_BLUR = 32;
      const MAX_SCALE_BOOST = 0.16;

      function envelope(time, start, end) {
        if (time < start) return 0;
        if (time < end) return Math.min((time - start) / ATTACK_DURATION, 1);
        const releaseEnd = end + RELEASE_DURATION;
        if (time < releaseEnd) {
          return 1 - ((time - end) / RELEASE_DURATION) * (1 - REST_LEVEL);
        }
        return REST_LEVEL;
      }

      const glowDriver = { t: 0 };
      tl.to(
        glowDriver,
        {
          t: 2.7,
          duration: 2.7,
          ease: "none",
          onUpdate: () => {
            modeWords.forEach((word) => {
              const timing = GLOW_TIMINGS[word.dataset.modeWord];
              if (!timing) return;
              const level = envelope(glowDriver.t, timing.start, timing.end);
              word.style.textShadow = `0 0 ${MAX_BLUR * level}px rgba(109, 125, 255, ${0.48 * level})`;
              word.style.transform = `scale(${1 + MAX_SCALE_BOOST * level})`;
            });
          },
        },
        1,
      );

      tl.fromTo(
        spotlights[0],
        { x: 96, autoAlpha: 0.35 },
        { x: 0, autoAlpha: 1, duration: 0.3, ease: "power4.out", immediateRender: false },
        1.08,
      );

      tl.to(spotlights[0], { x: -96, duration: 0.28, ease: "power4.in" }, 1.7);
      tl.to(spotlights[0], { autoAlpha: 0, duration: 0.17, ease: "power1.in" }, 1.81);
      tl.fromTo(
        spotlights[1],
        { x: 96, autoAlpha: 0.35 },
        { x: 0, autoAlpha: 1, duration: 0.3, ease: "power4.out", immediateRender: false },
        1.98,
      );

      tl.to(spotlights[1], { x: -96, duration: 0.28, ease: "power4.in" }, 2.6);
      tl.to(spotlights[1], { autoAlpha: 0, duration: 0.17, ease: "power1.in" }, 2.71);
      tl.fromTo(
        spotlights[2],
        { x: 96, autoAlpha: 0.35 },
        { x: 0, autoAlpha: 1, duration: 0.3, ease: "power4.out", immediateRender: false },
        2.88,
      );

      tl.to(spotlights[2], { x: -96, duration: 0.28, ease: "power4.in" }, 3.42);
      tl.to(spotlights[2], { autoAlpha: 0, duration: 0.17, ease: "power1.in" }, 3.53);

      tl.to(
        modeLabels,
        {
          opacity: 1,
          backgroundColor: "rgba(109, 125, 255, 0.22)",
          duration: 0.28,
          ease: "power2.out",
        },
        3.7,
      );

      tl.to(modeWords, { scale: 1, textShadow: "0 0 0 rgba(109, 125, 255, 0)", duration: 0.2, ease: "power2.out" }, 3.7);
      tl.to(modeLabels[0], { x: 0, y: 95, duration: 0.38, ease: "power3.inOut" }, 3.7);
      tl.to(modeLabels[1], { x: 79, y: 23, duration: 0.38, ease: "power3.inOut" }, 3.73);
      tl.to(modeLabels[2], { x: 158, y: -50, duration: 0.38, ease: "power3.inOut" }, 3.76);

      tl.fromTo(
        chainLine,
        { scaleX: 0, autoAlpha: 0.35 },
        { scaleX: 1, autoAlpha: 0.82, duration: 0.38, ease: "power3.out", immediateRender: false },
        3.7,
      );

      tl.fromTo(
        chainWord,
        { x: 96, autoAlpha: 0.35 },
        { x: 0, autoAlpha: 1, duration: 0.32, ease: "power4.out", immediateRender: false },
        3.8,
      );

      tl.fromTo(
        confirmPoint,
        { scale: 0.45, autoAlpha: 0 },
        { scale: 1, autoAlpha: 1, duration: 0.2, ease: "power3.out", immediateRender: false },
        3.98,
      );
    })();
  </script>
