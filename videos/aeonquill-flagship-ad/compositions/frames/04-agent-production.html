  <script>
    (() => {
      const root = document.querySelector('[data-composition-id="04-agent-production"]');
      const gsapRuntime = window.gsap;
      const byId = (suffix) => document.getElementById(`f04-agent-production-${suffix}`);

      const uiStage = byId("ui-stage");
      const title = byId("title");
      const titleRule = byId("title-rule");
      const directorNode = byId("node-director");
      const writerNode = byId("node-writer");
      const progressFill = byId("progress-fill");
      const progressAura = byId("progress-aura");
      const ring = byId("working-ring");
      const ringArc = byId("working-ring-arc");
      const dimmer = byId("screen-dimmer");
      const receipt = byId("receipt");
      const receiptLabel = byId("receipt-label");
      const everyStep = byId("every-step");
      const decision = byId("decision");
      const confirmLine = byId("confirm-line");
      const confirmCheck = byId("confirm-check");
      const pagenum = byId("pagenum");

      const tl = gsapRuntime.timeline({ paused: true });
      window.__timelines = window.__timelines || {};
      window.__timelines["04-agent-production"] = tl;

      tl.fromTo(
        uiStage,
        { opacity: 0.2, rotationY: -3.4, rotationX: 1.25, scale: 0.975 },
        {
          opacity: 1,
          rotationY: 0,
          rotationX: 0,
          scale: 1,
          duration: 0.78,
          ease: "power2.out",
          immediateRender: true,
        },
        0,
      );

      tl.fromTo(
        title,
        { opacity: 0, y: -10 },
        { opacity: 1, y: 0, duration: 0.38, ease: "power1.out", immediateRender: true },
        0.08,
      );
      tl.fromTo(
        titleRule,
        { scaleX: 0, opacity: 0 },
        { scaleX: 1, opacity: 1, duration: 0.58, ease: "power2.out", immediateRender: true },
        0.18,
      );
      tl.fromTo(
        directorNode,
        { opacity: 0, scaleY: 0.94 },
        { opacity: 1, scaleY: 1, duration: 0.34, ease: "power1.out", immediateRender: true },
        0.24,
      );
      tl.fromTo(
        writerNode,
        { opacity: 0, scaleY: 0.94 },
        { opacity: 1, scaleY: 1, duration: 0.34, ease: "power1.out", immediateRender: true },
        0.58,
      );

      tl.fromTo(
        progressFill,
        { scaleX: 0 },
        { scaleX: 1, duration: 3.05, ease: "none", immediateRender: true },
        1.1,
      );
      tl.fromTo(
        progressAura,
        { scaleX: 0, opacity: 0 },
        { scaleX: 1, opacity: 1, duration: 3.05, ease: "none", immediateRender: true },
        1.1,
      );

      const stateWords = ["待处理", "协作中", "可审核"];
      const stateHolds = [0.08, 0.2, 0.34];
      const makeSchedule = (start) => {
        let cursor = start;
        return stateWords.map((text, index) => {
          const duration = 0.14 + text.length * 0.025 + stateHolds[index];
          const entry = { text, start: cursor, end: cursor + duration };
          cursor += duration;
          return entry;
        });
      };
      const stageSpecs = [
        {
          element: byId("stage-storyboard"),
          state: byId("state-storyboard"),
          marker: root.querySelector('[data-f04-stage="storyboard"] [data-f04-stage-marker]'),
          start: 1.1,
          schedule: makeSchedule(1.1),
        },
        {
          element: byId("stage-character"),
          state: byId("state-character"),
          marker: root.querySelector('[data-f04-stage="character"] [data-f04-stage-marker]'),
          start: 2.0,
          schedule: makeSchedule(2.0),
        },
        {
          element: byId("stage-edit"),
          state: byId("state-edit"),
          marker: root.querySelector('[data-f04-stage="edit"] [data-f04-stage-marker]'),
          start: 2.9,
          schedule: makeSchedule(2.9),
        },
      ];

      const stateAt = (schedule, time) => {
        for (let index = schedule.length - 1; index >= 0; index -= 1) {
          if (time >= schedule[index].start) return schedule[index].text;
        }
        return "";
      };

      stageSpecs.forEach((stage) => {
        tl.fromTo(
          stage.element,
          { opacity: 0, y: 12 },
          { opacity: 1, y: 0, duration: 0.34, ease: "power1.out", immediateRender: true },
          stage.start,
        );
        tl.fromTo(
          stage.marker,
          { scaleX: 0 },
          { scaleX: 1, duration: 0.48, ease: "power2.out", immediateRender: true },
          stage.start + 0.1,
        );
      });

      const stateDriver = { t: 0 };
      const lastStates = ["", "", ""];
      tl.to(
        stateDriver,
        {
          t: 4.4,
          duration: 4.4,
          ease: "none",
          onUpdate: () => {
            stageSpecs.forEach((stage, index) => {
              const next = stateAt(stage.schedule, stateDriver.t);
              if (next !== lastStates[index]) {
                stage.state.textContent = next;
                lastStates[index] = next;
              }
            });
          },
        },
        0,
      );

      tl.fromTo(
        ring,
        { opacity: 0, scale: 0.88 },
        { opacity: 1, scale: 1, duration: 0.25, ease: "power1.out", immediateRender: true },
        1.1,
      );
      const ringState = { degrees: 0 };
      tl.to(
        ringState,
        {
          degrees: 810,
          duration: 3.04,
          ease: "none",
          onUpdate: () => {
            ringArc.setAttribute("transform", `rotate(${ringState.degrees} 32 32)`);
          },
        },
        1.1,
      );
      tl.to(ring, { opacity: 0, duration: 0.12, ease: "power1.out" }, 4.14);

      [confirmLine, confirmCheck].forEach((path) => {
        const length = path.getTotalLength();
        path.style.strokeDasharray = `${length}`;
        path.style.strokeDashoffset = `${length}`;
      });

      tl.fromTo(
        receipt,
        { opacity: 0, y: 18, scale: 0.965 },
        { opacity: 1, y: 0, scale: 1, duration: 0.44, ease: "power2.out", immediateRender: true },
        4.4,
      );
      tl.to(dimmer, { opacity: 1, duration: 0.34, ease: "power1.out" }, 4.4);
      tl.fromTo(
        receiptLabel,
        { opacity: 0, y: 8 },
        { opacity: 1, y: 0, duration: 0.24, ease: "power1.out", immediateRender: true },
        4.48,
      );
      tl.fromTo(
        everyStep,
        { opacity: 0, y: 10 },
        { opacity: 1, y: 0, duration: 0.3, ease: "power1.out", immediateRender: true },
        4.56,
      );
      tl.fromTo(
        decision,
        { opacity: 0, y: 12 },
        { opacity: 1, y: 0, duration: 0.34, ease: "power2.out", immediateRender: true },
        4.82,
      );
      tl.to(
        confirmLine,
        { strokeDashoffset: 0, duration: 0.46, ease: "power2.out" },
        4.82,
      );
