        const tumbleY = Math.cos(angle) * 68;
        const ringAngle = -Math.PI / 2 + (index / fragmentCount) * Math.PI * 2;
        const ringRadius = 246 + (index % 3) * 24;
        const ringX = Math.cos(ringAngle) * ringRadius;
        const ringY = Math.sin(ringAngle) * ringRadius * 0.72;

        tl.fromTo(

            z: scatterZ,

            duration: 1.04,
            ease: "power3.out",
            immediateRender: true
          },
          0.05 + index * 0.035
        );

        tl.to(
          fragment,
          {
            x: ringX,
            y: ringY,
            z: 0,
            rotationX: 0,
            rotationY: 0,
            scale: 1,
            opacity: 1,
            duration: 1.05,
            ease: "power3.out"

        );

        tl.to(
          fragmentCores[index],
          {
            scaleX: index % 4 === 0 ? 3.5 : 2.55,
            scaleY: 0.22,
            rotation: (ringAngle * 180) / Math.PI + 90,
            backgroundColor: index % 3 === 0 ? "#C7A562" : "#6D7DFF",
            duration: 0.7,
            ease: "power3.out"
          },
          1.36 + index * 0.02
        );

        tl.to(
          fragment,
          {
            x: ringX * 1.13,
            y: ringY * 1.13,
            opacity: 0,
            duration: 0.62,
            ease: "power2.out"
          },
          3.68 + index * 0.015
        );
      });

      tl.to(stage, { rotationY: 0, rotationX: 0, duration: 1.0, ease: "power3.out" }, 1.3);
      tl.to(stage, { x: -280, duration: 0.78, ease: "power2.inOut" }, 3.3);

      tl.fromTo(
        icon,
        { scale: 0, opacity: 0 },
        { scale: 1, opacity: 1, duration: 1.02, ease: "power3.out", immediateRender: true },

      );
      tl.to(icon, { x: -280, duration: 0.78, ease: "power2.inOut" }, 3.3);

      tl.fromTo(
        ringCircle,
        { strokeDasharray: 1320, strokeDashoffset: 1320, opacity: 0 },
        { strokeDashoffset: 0, opacity: 0.52, duration: 0.96, ease: "power2.out", immediateRender: true },
        1.42
      );
      ringTicks.forEach((tick, index) => {
        const tickLength = index % 3 === 0 ? 22 : 14;
        tl.fromTo(
          tick,
          { strokeDasharray: tickLength, strokeDashoffset: tickLength, opacity: 0 },
          { strokeDashoffset: 0, opacity: 0.9, duration: 0.34, ease: "power2.out", immediateRender: true },
          1.62 + index * 0.055
        );
      });
      tl.to(ring, { x: -280, scale: 0.72, duration: 0.78, ease: "power2.inOut" }, 3.3);
      tl.to(ring, { opacity: 0, duration: 0.66, ease: "power2.out" }, 3.56);

      tl.fromTo(
        wordmark,
        { x: -180, opacity: 0 },
        { x: 0, opacity: 1, duration: 0.74, ease: "power3.out", immediateRender: true },

      );
      tl.fromTo(
        goldRule,
        { scaleX: 0, opacity: 0 },
        { scaleX: 1, opacity: 1, duration: 0.72, ease: "power3.out", immediateRender: true },
        3.42
      );
      tl.fromTo(
        taglineOne,
        { clipPath: "inset(0 100% 0 0)", x: -18, opacity: 0 },
        { clipPath: "inset(0 0% 0 0)", x: 0, opacity: 1, duration: 0.58, ease: "power3.out", immediateRender: true },
        3.68
      );
      tl.fromTo(
        taglineTwo,
        { clipPath: "inset(0 100% 0 0)" },
        { clipPath: "inset(0 0% 0 0)", duration: 0.46, ease: "power2.out", immediateRender: true },
        4.3
      );
    })();
